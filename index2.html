<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seasons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 21px;
        }
        
        ul {
            margin: 0;
            padding-left: 46px;
            list-style-image: url("images/arrow.png");
        }
        
        li {
            line-height: 30px;
        }
        
        .winter {
            list-style-image: url("images/snowflake.png");
        }
        
        .spring {
            list-style-image: url("images/clover.png");
        }
        
        .summer {
            list-style-image: url("images/sun.png");
        }
        
        .autumn {
            list-style-image: url("images/leaf.png");
        }
    </style>
</head>

<body>
    <ul>
        <li>Winter
            <ul class="winter">
                <li>December</li>
                <li>January</li>
                <li>February</li>
            </ul>
        </li>
        <li>Spring
            <ul class="spring">
                <li>March</li>
                <li>April</li>
                <li>May</li>
            </ul>
        </li>
        <li>Summer
            <ul class="summer">
                <li>June</li>
                <li>July</li>
                <li>August</li>
            </ul>
        </li>
        <li>Autumn
            <ul class="autumn">
                <li>September</li>
                <li>October</li>
                <li>November</li>
            </ul>
        </li>
    </ul>
</body>

</html>
