<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To Do List</title>
    <style>
        body {
            margin: 16px;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0 0 22px;
        }

        ul {
            max-width: 420px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            padding: 16px 30px;
            background-color: #a5ccdb;
        }

        li:nth-child(even) {
            background-color: #add9e6;
        }

        li.done {
            background-color: #e2e2e2;
        }

        li.done span {
            text-decoration: line-through;
        }

        li::before {
            content: "☐";
            display: inline-block;
            width: 40px;
            font-size: 20px;
            line-height: 20px;
        }

        li.done::before {
            content: "☑";
        }

        li::after {
            content: "×";
            margin-left: 24px;
            color: red;
        }
    </style>
</head>
<body>
    <h1>My To Do List</h1>
    <ul>
        <li><span>Hit the gym</span></li>
        <li><span>Pay bills</span></li>
        <li class="done"><span>Meet John</span></li>
        <li class="done"><span>Buy eggs</span></li>
        <li><span>Read a book</span></li>
        <li><span>Organize office</span></li>
        <li><span>Eat dinner</span></li>
        <li><span>Buy apples</span></li>
        <li><span>Meet Georg</span></li>
        <li class="done"><span>Feed the cat</span></li>
        <li><span>Write a letter</span></li>
        <li><span>Run 1 km</span></li>
    </ul>
</body>
</html>
